<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="東京で買う時代から、船橋で収益を作る時代へ。無料個別相談を受付中です。"
    >
    <title>船橋 不動産投資｜無料個別相談</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main class="lp">
      <h1 class="visually-hidden">
        東京で買う時代から、船橋で収益を作る時代へ
      </h1>

      <div class="lp__image">
        <img
          src="./img/1.png?v=202608271753"
          alt="東京で1室買うなら船橋で1棟。想定利回り6パーセント台、高い賃料実績"
          width="1154"
          height="1363"
        >
      </div>

      <section class="quick-contact" aria-labelledby="quick-contact-title">
        <div class="quick-contact__inner">
          <h2 id="quick-contact-title"><strong>無料</strong><span>｜</span>個別相談を予約する</h2>
          <p>物件情報・収益シミュレーションをお届けします。</p>

          <form class="quick-contact__form" action="#contact-title" method="get">
            <label class="quick-row">
              <span>お名前 <b>必須</b></span>
              <input name="quick_name" autocomplete="name" placeholder="例）山田 太郎" required>
            </label>
            <label class="quick-row">
              <span>メールアドレス <b>必須</b></span>
              <input type="email" name="quick_email" autocomplete="email" placeholder="例）sample@mail.com" required>
            </label>
            <label class="quick-row">
              <span>電話番号 <b>必須</b></span>
              <input type="tel" name="quick_tel" autocomplete="tel" placeholder="例）090-1234-5678" required>
            </label>
            <div class="quick-row quick-row--options">
              <span>ご希望の<br>連絡方法 <b>必須</b></span>
              <div>
                <label><input type="checkbox" name="quick_contact_method" value="メール">メール</label>
                <label><input type="checkbox" name="quick_contact_method" value="電話">電話</label>
                <label><input type="checkbox" name="quick_contact_method" value="郵送">郵送</label>
              </div>
            </div>
            <div class="quick-row quick-row--options">
              <span>ご検討状況 <em>任意</em></span>
              <div class="quick-status">
                <label><input type="radio" name="quick_status" value="情報収集中">情報収集中</label>
                <label><input type="radio" name="quick_status" value="比較検討中">比較検討中</label>
                <label><input type="radio" name="quick_status" value="具体的に検討中">具体的に検討中</label>
              </div>
            </div>
            <button type="submit">無料で相談してみる <span aria-hidden="true">›</span></button>
          </form>
          <small>プライバシーポリシーに同意の上、送信してください。</small>
        </div>
      </section>

      <div class="lp__image">
        <img
          src="./img/3.png?v=202608271753"
          alt="東京は守りのフェーズ、船橋は攻めのフェーズ。増やすなら船橋"
          width="1024"
          height="1536"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/4.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1121"
          height="1403"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/5.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1038"
          height="1516"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/6.png?v=202608271804"
          alt="船橋の不動産投資についてのご案内"
          width="1023"
          height="1537"
        >
      </div>

      <div class="lp__image lp__image--link-map">
        <img
          src="./img/7.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1402"
          height="1122"
        >
        <a
          class="image-hotspot image-hotspot--investment"
          href="#contact-title"
          aria-label="船橋の最新投資情報を受け取るため、お問い合わせフォームへ移動"
        ></a>
      </div>

      <div class="lp__image lp__image--link-map">
        <img
          src="./img/8.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1024"
          height="1536"
        >
        <a
          class="image-hotspot image-hotspot--funabashi"
          href="#contact-title"
          aria-label="船橋の不動産タウンという暮らしについて相談する"
        ></a>
      </div>

      <div class="lp__image">
        <img
          src="./img/9.png?v=202608271843"
          alt="船橋の不動産投資についてのご案内"
          width="941"
          height="1672"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/10.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="864"
          height="1821"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/11.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1024"
          height="1536"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/12.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="864"
          height="1821"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/13.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1536"
          height="1024"
        >
      </div>

      <div class="lp__image">
        <img
          src="./img/14.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="864"
          height="1821"
        >
      </div>

      <div class="lp__image lp__image--link-map">
        <img
          src="./img/15.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1038"
          height="1516"
        >
        <a
          class="image-hotspot image-hotspot--consultation"
          href="#contact-title"
          aria-label="無料相談のお問い合わせフォームへ移動"
        ></a>
        <a
          class="image-hotspot image-hotspot--download"
          href="#contact-title"
          aria-label="資料ダウンロードのお問い合わせフォームへ移動"
        ></a>
      </div>

      <div class="lp__image">
        <img
          src="./img/16.png?v=202608271753"
          alt="船橋の不動産投資についてのご案内"
          width="1024"
          height="1536"
        >
      </div>

      <section class="contact" aria-label="お問い合わせフォーム">
        <div class="contact__hero" id="contact-title">
          <img
            src="./img/17.png?v=202608271753"
            alt="無料相談と投資に役立つ資料のご案内"
            width="871"
            height="1806"
          >
        </div>

        <form class="contact__form" action="#" method="post">
          <fieldset class="form-section">
            <legend>お問い合わせの内容 <b>必須</b></legend>
            <div class="choice-grid choice-grid--two">
              <label><input type="radio" name="inquiry_type" value="資料ダウンロード" required>資料ダウンロード</label>
              <label><input type="radio" name="inquiry_type" value="投資相談と資料ダウンロード">投資のご相談＆資料ダウンロード</label>
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend>当サービスを知ったきっかけ <b>必須</b></legend>
            <div class="choice-grid choice-grid--two">
              <label><input type="radio" name="source" value="インターネット広告" required>インターネット広告を見た</label>
              <label><input type="radio" name="source" value="ホームページ">弊社ホームページを見た</label>
              <label><input type="radio" name="source" value="Instagram">弊社インスタグラムを見た</label>
              <label><input type="radio" name="source" value="メディアサイト">弊社メディアサイトを見た</label>
              <label><input type="radio" name="source" value="施工物件">弊社施工物件を見た</label>
              <label><input type="radio" name="source" value="紹介">友人知人からの紹介</label>
              <label><input type="radio" name="source" value="その他">その他</label>
            </div>
          </fieldset>

          <fieldset class="form-section form-section--rows">
            <legend>お客様情報の入力 <b>必須</b></legend>
            <label class="form-row"><span>お名前</span><input name="name" autocomplete="name" placeholder="例）山田 太郎" required></label>
            <label class="form-row"><span>フリガナ</span><input name="name_kana" placeholder="例）ヤマダ タロウ" required></label>
            <label class="form-row"><span>年齢</span><input type="number" name="age" min="18" max="120" inputmode="numeric" placeholder="例）35" required></label>
            <label class="form-row"><span>メールアドレス</span><input type="email" name="email" autocomplete="email" placeholder="例）example@linxsestate.co.jp" required></label>
            <label class="form-row"><span>電話番号（携帯可）</span><input type="tel" name="tel" autocomplete="tel" placeholder="例）090-1234-5678" required></label>
          </fieldset>

          <fieldset class="form-section form-section--rows">
            <legend>以下は、より詳細な物件のご提案のために必要な項目です <em>任意</em></legend>
            <div class="form-row form-row--address"><span>お住まい</span><div><select name="prefecture"><option value="">都道府県を選択</option><option>北海道</option><option>東京都</option><option>神奈川県</option><option>千葉県</option><option>埼玉県</option><option>大阪府</option><option>愛知県</option><option>福岡県</option><option>その他</option></select><input name="city" autocomplete="address-level2" placeholder="例）新宿区"></div></div>
            <div class="form-row"><span>ご職業</span><div class="choice-grid choice-grid--jobs"><label><input type="radio" name="job" value="会社員">会社員</label><label><input type="radio" name="job" value="会社役員">会社役員</label><label><input type="radio" name="job" value="公務員">公務員</label><label><input type="radio" name="job" value="自営業">自営業</label><label><input type="radio" name="job" value="士業">医師・弁護士・会計士</label><label><input type="radio" name="job" value="不動産業">不動産業</label><label><input type="radio" name="job" value="その他">その他</label></div></div>
            <label class="form-row"><span>勤務先</span><input name="company" autocomplete="organization" placeholder="例）株式会社〇〇"></label>
            <label class="form-row"><span>役職</span><input name="position" placeholder="例）課長"></label>
            <label class="form-row"><span>年収（給与収入）</span><span class="input-unit"><input type="number" name="income" inputmode="numeric" placeholder="例）800"><i>万円</i></span></label>
            <label class="form-row"><span>金融資産</span><span class="input-unit"><input type="number" name="assets" inputmode="numeric" placeholder="例）1000"><i>万円</i></span></label>
            <label class="form-row"><span>所有不動産</span><input name="real_estate" placeholder="例）区分マンション1戸"></label>
            <label class="form-row"><span>借入内容</span><input name="loans" placeholder="例）住宅ローン残高2,000万円"></label>
          </fieldset>

          <fieldset class="form-section form-section--message">
            <legend>お問い合わせ内容 <em>任意</em></legend>
            <textarea name="message" rows="4" placeholder="例）希望エリアや物件の条件、その他ご質問などご自由にご入力ください。"></textarea>
            <label class="consent"><input type="checkbox" name="privacy" required><span><a href="#" target="_blank" rel="noopener">プライバシーポリシー</a>に同意しました。</span></label>
            <label class="consent"><input type="checkbox" name="distribution" required><span>弊社が同業者もしくはそれに準ずる方と判断した場合は、資料等の配信をお断りする場合がある旨了承しました。</span></label>
            <button type="submit">内容を確認する <span aria-hidden="true">›</span></button>
          </fieldset>
        </form>
      </section>

    </main>
  </body>
</html>
